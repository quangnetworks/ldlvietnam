name: QUANTUM FULL — test & build

# Kiểm thử + build cho dự án quantum-full. Deploy CHỈ khi chủ dự án kích hoạt thủ công (deploy=true).
on:
  push:
    paths: ['quantum-full/**', '.github/workflows/quantum-full.yml']
  pull_request:
    paths: ['quantum-full/**']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy lên Cloudflare (quantum.vanquang.xyz) sau khi test đạt'
        type: boolean
        default: false

defaults:
  run:
    working-directory: quantum-full

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quantum-full/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: E2E (Playwright)
        run: |
          npx playwright install --with-deps chromium
          cp .dev.vars.example .dev.vars
          npm run test:e2e

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx wrangler d1 migrations apply quantum-full-db --remote
      - run: npx wrangler deploy
