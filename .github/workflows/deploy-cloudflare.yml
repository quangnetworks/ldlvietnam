name: Test LDL Workspace

# KHÔNG tự deploy từ GitHub. Worker ldlvietnam-workspace chỉ được deploy thủ công từ máy quản trị
# (node server/scripts/cf-setup.mjs --reuse) — lần tự deploy trước đây từ nhánh cũ đã đè lên phiên bản mới
# và làm mất tính năng trên home.ldlvn.xyz. Workflow này chỉ chạy kiểm thử.

on:
  push:
    branches: [main, claude/charming-heisenberg-xtzan2]
    paths: ['server/**', 'client/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix server ci
      - run: npm --prefix server test
