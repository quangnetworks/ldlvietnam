name: Deploy to Cloudflare

on:
  push:
    branches: [main, claude/charming-heisenberg-xtzan2]
  workflow_dispatch:
    inputs:
      diagnose:
        description: 'Tạm thời: tài khoản cần chẩn đoán duyệt hoàn thành (chỉ đọc)'
        required: false
        default: ''

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix server ci
      - run: npm --prefix server test

  diagnose:
    if: ${{ github.event.inputs.diagnose != '' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WHO: ${{ github.event.inputs.diagnose }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix server ci
      - name: Chẩn đoán (chỉ đọc)
        run: node server/scripts/diagnose-approval.mjs

  deploy:
    needs: test
    if: ${{ github.event.inputs.diagnose == '' || github.event.inputs.diagnose == null }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Kiểm tra secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Chưa cấu hình CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID trong GitHub Secrets — bỏ qua deploy. Xem DEPLOY.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - run: npm --prefix server ci
        if: steps.check.outputs.ready == 'true'
      - name: Provision D1/R2 và deploy
        if: steps.check.outputs.ready == 'true'
        run: node server/scripts/cf-setup.mjs --reuse
