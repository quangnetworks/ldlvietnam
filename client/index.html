<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="icon" type="image/png" sizes="72x72" href="/apple-touch-icon-72.png" />
    <link rel="apple-touch-icon" sizes="57x57" href="/apple-touch-icon-57.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="/apple-touch-icon-60.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/apple-touch-icon-72.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#37404b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LDL" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap&subset=vietnamese" rel="stylesheet" />
    <script>
      // Áp giao diện sáng/tối trước khi vẽ trang để không bị nháy màu
      try {
        var t = localStorage.getItem('ldl_theme') || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var brands = [
          ['linear-gradient(135deg, #1b2a33 0%, #0e3b43 45%, #11242c 100%)', '#10252c', '#173239', '#1d3e46'],
          ['linear-gradient(135deg, #2b1d1d 0%, #5a1f1f 50%, #1e1414 100%)', '#261616', '#341d1d', '#442424'],
          ['linear-gradient(135deg, #1a1f36 0%, #283593 50%, #121630 100%)', '#161a31', '#1f2546', '#283060'],
          ['linear-gradient(135deg, #1d2b1f 0%, #2e5e3a 50%, #142018 100%)', '#152219', '#1c2f22', '#243d2c'],
          ['linear-gradient(135deg, #2d2d2d 0%, #444 50%, #1c1c1c 100%)', '#1f1f1f', '#2a2a2a', '#363636'],
          ['linear-gradient(135deg, #3b2412 0%, #8a4b14 50%, #26170c 100%)', '#27180c', '#352112', '#452b17']
        ];
        var b = brands[Number(localStorage.getItem('ldl_brand')) || 0] || brands[0];
        var st = document.documentElement.style;
        st.setProperty('--brand-grad', b[0]); st.setProperty('--brand-side', b[1]);
        st.setProperty('--brand-hover', b[2]); st.setProperty('--brand-active', b[3]);
      } catch (e) {}
    </script>
    <title>Công ty LDL Việt Nam</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
